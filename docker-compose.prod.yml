# Production stack:  Browser -> web (Nginx) -> backend (Spring Boot) -> db (Postgres)
# The `web` service serves the built SPA AND reverse-proxies /api and /uploads to
# the backend, so it is the single edge. Run with:
#   docker compose -f docker-compose.prod.yml up --build

services:
  db:
    image: postgres:15
    container_name: angkorlance-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-angkorlance}
    volumes:
      - angkorlance-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-angkorlance}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  backend:
    build: ./backend
    container_name: angkorlance-backend
    # Copy backend/.env.prod.example -> backend/.env.prod and fill in real values.
    env_file:
      - ./backend/.env.prod
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/${POSTGRES_DB:-angkorlance}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-postgres}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - angkorlance-uploads:/var/www/images
    restart: unless-stopped

  web:
    build:
      context: ./frontend
      args:
        VITE_API_URL: /api
    container_name: angkorlance-web
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  angkorlance-db-data:
  angkorlance-uploads:
